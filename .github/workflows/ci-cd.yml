name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run tests and build wheel
        run: |
          # Запускаем твой скрипт, который делает тесты и сборку wheel в Docker
          bash ci/build.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-wheel
          path: artifacts/*.whl
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: app-wheel
          path: ./artifacts

      - name: Copy artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/*.whl"
          target: "~/buz-lab-devops/artifacts/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Starting deployment..."
            cd ~/buz-lab-devops

            git pull origin main

            echo "Artifacts on server:"
            ls -la artifacts/

            bash deploy/deploy.sh
            
            echo "Deployment finished successfully!"