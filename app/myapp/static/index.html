<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер арабских слов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <h1>Карточки арабских слов v.1.1.1</h1>
            <p class="subtitle">سِجِلُّ تَعَلُّمِ اللُّغَةِ الْعَرَبِيَّةِ</p>
        </header>

        <!-- Двухколоночный блок -->
        <main class="main-layout">
            <!-- Левая часть: Ввод слов -->
            <section class="card form-card">
                <h2>Добавить слово</h2>
                <form action="/add" method="POST">
                    <div class="form-group">
                        <label for="arabic">Арабский:</label>
                        <input type="text" id="arabic" name="arabic" class="arabic-input" placeholder="مثال: كِتَابٌ" required dir="rtl">
                    </div>
                    <div class="form-group">
                        <label for="translation">Перевод:</label>
                        <input type="text" id="translation" name="translation" placeholder="Например: Книга" required>
                    </div>
                    <button type="submit" class="btn-submit">Добавить в словарь</button>
                </form>
            </section>

            <!-- Правая часть: Словарь -->
            <section class="card table-card">
                <h2>Словарь</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="th-arabic">Арабский</th>
                                <th>Перевод</th>
                                <th class="th-action">Действие</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for word in words %}
                            <tr>
                                <td class="td-arabic" dir="rtl">{{ word[1] }}</td>
                                <td class="td-translation">{{ word[2] }}</td>
                                <td class="td-action">
                                    <a href="/delete/{{ word[0] }}" class="btn-delete" title="Удалить слово">удалить</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" class="empty-state">Словарь пуст. Добавьте первое слово слева!</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- Подвал -->
        <footer class="footer">
            <div class="links">
                <a href="/health">Health Check</a>
                <span class="sep">•</span>
                <a href="/metrics">Prometheus Metrics</a>
            </div>
        </footer>
    </div>
</body>
</html>
